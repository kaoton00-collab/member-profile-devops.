<html lang="th">
<head>

    body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; color: #2c3e50; }
    .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 30px; }

    .card:hover { box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
    .card img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
  </style>
</head>

</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าแรก — สมาชิกกลุ่ม</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", "Chakra Petch", sans-serif;
    }

    body {
      background: #fff;
      color: #222;
      padding: 40px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 50px;
      position: relative;
    }

    h1::after {
      content: "";
      display: block;
      width: 120px;
      height: 4px;
      background: #222;
      margin: 12px auto 0;
      border-radius: 2px;
    }

    .cards-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: #f9f9f9;
      border: 2px solid #222;
      border-radius: 20px;
      padding: 30px 20px;
      width: 260px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.15);
    }

    .card:hover {
      transform: translate(-4px, -4px);
      box-shadow: 10px 10px 0 rgba(0,0,0,0.2);
    }

    .card-img {
      width: 150px;
      height: 180px;
      object-fit: cover;
      border: 6px solid #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }

    .card h3 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 16px;
      color: #555;
      line-height: 1.6;
    }

    .card .nickname {
      display: inline-block;
      background: #222;
      color: #fff;
      padding: 4px 14px;
      border-radius: 50px;
      font-size: 15px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>👥 สมาชิกกลุ่ม</h1>

  <div class="cards-container">
    <!-- การ์ดคนที่ 1 เชื่อมไป person1.html -->
    <a href="person1.html" class="card">
      <img src="profile" alt="รูปโครินา" class="card-img">
      <h3>บัณฑิต จำปา </h3>
      <span class="nickname">ชื่อเล่น: ต้นข้าว</span>
    </a>

    <!-- การ์ดคนที่ 2 เชื่อมไป person2.html -->
    <a href="person2.html" class="card">
      <img src="profile2.jpg" alt="รูปสมาชิกคนที่ 2" class="card-img">
      <h3>ชื่อ ชณปกร หน่องแก้ว</h3>
      <span class="nickname">ชื่อเล่น: กัน</span>
    </a>

    <!-- การ์ดคนที่ 3 เชื่อมไป person3.html -->
    <a href="person3.html" class="card">
      <img src="profile3" alt="รูปสมาชิกคนที่ 3" class="card-img">
      <h3>ชื่อ พลังโชค เคียงอมร</h3>
      <span class="nickname">ชื่อเล่น: เก่ง</span>
    </a>
  </div>

</body>
</html>
